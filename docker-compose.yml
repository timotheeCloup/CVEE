services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cvee_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # No container_name: Compose names containers after the project (worktree
  # directory), so parallel worktrees no longer fight over a fixed name and
  # `docker compose down` always removes the containers it created. The UI still
  # reaches the API through the service name `cvee-api` on the compose network.
  cvee-api:
    build: ./api
    ports:
      - "8000:8080"
    volumes:
      - ./api:/app
    # Auto-reload on source changes (the bind-mount above shadows /app).
    command: uvicorn app:app --host 0.0.0.0 --port 8080 --reload
    # Read-only against the real Supabase database (same data as production),
    # mirroring the Cloud Run dev environment. The API only runs SELECTs.
    environment:
      DB_HOST: ${SB_HOST}
      DB_PORT: ${SB_PORT}
      DB_USER: ${SB_USER}
      DB_PASSWORD: ${SB_PASSWORD}
      DB_NAME: ${SB_NAME}
  cvee-ui:
    build: ./ui
    ports:
      - "8501:8080"
    volumes:
      - ./ui:/app
    environment:
      API_URL: http://cvee-api:8080/embed-cv
    depends_on:
      cvee-api:
        condition: service_started
        

volumes:
  postgres_data: